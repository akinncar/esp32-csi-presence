[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 460800
board_upload.flash_size = 16MB
; WiFi credentials come from environment variables at build time, never from a file.
; Without them it uses the WiFi saved on the board, or falls back to passive mode.
; Upload port is auto-detected; override with: pio run -t upload --upload-port <port>
extra_scripts = pre:wifi_env.py
